<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport mein "user-scalable=no" phone pe double tap zoom rokne k liye rakha gaya hai taki app jaisa feel ho -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Calculator web</title>
    
    <!-- Futuristic 'Space Grotesk' font load ho raha hai web se -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome icons ke liye (jaise sun, moon, logs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Design styling ki file link karna -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <!-- ==============================================
         Aura Orbs (Peeche ghumne wlai rangeen raushniyan) 
         ============================================== -->
    <div class="aura-container">
        <!-- Teen light ball banaye joki CSS me blur aur animate honge -->
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- APP CONTAINER (Jo display aur hisaab-kitab ko center me leke ayegi website pe) -->
    <div class="app-container" id="app-container">
        
        <!-- HISTORY PANEL (Pichlay records ka popup window) -->
        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <!-- Naye Sci-Fi feel ke liye name change krdiya history se -->
                <h3>MEM-LOGS</h3>
                <button class="icon-btn" id="close-history"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- JavaScript yaha sare previous answer laayegi memory se padh kar -->
            <div class="history-list" id="history-list"></div>
            
            <button class="clear-history" id="clear-history">ERASE DATA</button>
        </div>

        <!-- ==============================================
             CALCULATOR UI (Main app window, mobile responsive)
             ============================================== -->
        <div class="calculator" id="calculator">
            
            <!-- TOP CONTROLS (Day/Night Theme switch & History Icon) -->
            <div class="top-controls">
                <button class="icon-btn theme-toggle" id="theme-toggle">
                    <i class="fas fa-adjust" id="theme-icon"></i> <!-- icon id se dynamically js badlega -->
                </button>
                <div class="brand">Calculator</div>
                <button class="icon-btn history-toggle" id="history-toggle">
                    <i class="fas fa-layer-group"></i>
                </button>
            </div>

            <!-- DISPLAY SECTION (Math Output ke liye) -->
            <div class="display" id="display-area">
                <!-- Chota expression header (ex: 20 * 5 =) -->
                <div class="previous-operand" id="previous-operand"></div>
                <!-- Bara Main output number area -->
                <div class="current-operand" id="current-operand">0</div>
                <!-- Background me real-time solve hone wala chota live display -->
                <div class="real-time-preview" id="real-time-preview"></div>
            </div>

            <!-- BUTTONS / KEYPAD -> Naye minimalist aesthetic style mein -->
            <div class="keypad">
                <!-- "data-action" js mein pta chalega user ne Number dabaya ya Function (AC/DEL) -->
                <button class="btn fn" data-action="clear">AC</button>
                <button class="btn fn" data-action="delete">DEL</button>
                <button class="btn op" data-action="operator" data-val="%">%</button>
                <button class="btn op" data-action="operator" data-val="/">÷</button>

                <!-- Normal Numbers 'data-val' value pakad k calculations karenge memory (js) me -->
                <button class="btn num" data-val="7">7</button>
                <button class="btn num" data-val="8">8</button>
                <button class="btn num" data-val="9">9</button>
                <button class="btn op" data-action="operator" data-val="*">×</button>

                <button class="btn num" data-val="4">4</button>
                <button class="btn num" data-val="5">5</button>
                <button class="btn num" data-val="6">6</button>
                <button class="btn op" data-action="operator" data-val="-">−</button>

                <button class="btn num" data-val="1">1</button>
                <button class="btn num" data-val="2">2</button>
                <button class="btn num" data-val="3">3</button>
                <button class="btn op" data-action="operator" data-val="+">+</button>

                <!-- Zero ka button extra widh/span cover karta hai isliye .zero class rakhi -->
                <button class="btn num zero" data-val="0">0</button>
                <button class="btn num" data-val=".">.</button>
                
                <!-- Equal to (=) button ko solid style/highlighted class di for visual attraction -->
                <button class="btn equal highlight" data-action="calculate">=</button>
            </div>
        </div>
    </div>

    <!-- GSAP JavaScript Library : Smooth bouncy animations ke liye lagata hu -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Code base logic ko html se attach karne ka JS link -->
    <script src="scrept.js"></script>
</body>
</html>
